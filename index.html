<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super vs Mortgage Calculator</title>
</head>
<body>
  <h2>Super vs Mortgage - Where Should You Put Extra Money?</h2>
  
  <label>Extra Monthly Contribution: $<input id="monthly" type="number" value="500"></label><br>
  <label>Mortgage Interest Rate (%): <input id="mortgageRate" type="number" value="6"></label><br>
  <label>Super Return Rate (%): <input id="superReturn" type="number" value="7"></label><br>
  <label>Marginal Tax Rate (%): <input id="taxRate" type="number" value="34.5"></label><br>
  <label>Years: <input id="years" type="number" value="10"></label><br><br>

  <button onclick="calculate()">Compare</button>

  <h3>Results:</h3>
  <div id="results"></div>

  <script>
    function calculate() {
      const monthly = parseFloat(document.getElementById("monthly").value);
      const mortgageRate = parseFloat(document.getElementById("mortgageRate").value) / 100;
      const superReturn = parseFloat(document.getElementById("superReturn").value) / 100;
      const taxRate = parseFloat(document.getElementById("taxRate").value) / 100;
      const years = parseInt(document.getElementById("years").value);
      const months = years * 12;

      // Mortgage savings (compounded monthly)
      let mortgageSavings = 0;
      for (let i = 0; i < months; i++) {
        mortgageSavings = (mortgageSavings + monthly) * (1 + mortgageRate / 12);
      }

      // Super contribution tax-adjusted
      const superMonthly = monthly * (1 - 0.15); // Super contributions taxed at 15%
      let superValue = 0;
      for (let i = 0; i < months; i++) {
        superValue = (superValue + superMonthly) * (1 + superReturn / 12);
      }

      document.getElementById("results").innerHTML = `
        <p><strong>Mortgage Interest Saved:</strong> $${mortgageSavings.toFixed(2)}</p>
        <p><strong>Value in Super (after 15% tax):</strong> $${superValue.toFixed(2)}</p>
        <p><strong>Better Option:</strong> ${superValue > mortgageSavings ? "Super" : "Mortgage"}</p>
      `;
    }
  </script>
</body>
</html>
